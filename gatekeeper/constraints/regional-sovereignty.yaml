apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RegionalSovereignty
metadata:
  name: regional-sovereignty-constraint
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
      - apiGroups: [""]
        kinds: ["Service"]
  parameters:
    allowed_regions:
      - "us-east-1"
