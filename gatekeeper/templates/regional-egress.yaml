apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: regionalsovereignty
  annotations:
    metadata.gatekeeper.sh/title: "Regional Sovereignty"
    metadata.gatekeeper.sh/version: 1.0.0
    description: >-
      Restricts deployments to authorized AWS regions based on annotations.
spec:
  crd:
    spec:
      names:
        kind: RegionalSovereignty
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowed_regions:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package regionalsovereignty

        violation[{"msg": msg}] {
          region := input.review.object.metadata.annotations["cloud-boot-app.io/region"]
          not is_allowed(region, input.parameters.allowed_regions)
          msg := sprintf("Region %v is not authorized. Allowed regions: %v", [region, input.parameters.allowed_regions])
        }

        is_allowed(region, allowed_regions) {
          region == allowed_regions[_]
        }
